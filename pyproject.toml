[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handtracking"
version = "0.1.0"
description = "Low-latency real-time hand tracking"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "mediapipe",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
gpu = ["moderngl>=5.8.0"]

[tool.setuptools.packages.find]
include = ["handtracking*"]
